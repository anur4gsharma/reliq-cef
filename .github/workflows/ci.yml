name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tk and virtualenv packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb
          python3 --version
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ matrix.python }}
      - name: Create Linux test environment
        if: runner.os == 'Linux'
        run: |
          python3 -m venv --system-site-packages .ci-venv
          echo "$GITHUB_WORKSPACE/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Install package and console command
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            .ci-venv/bin/python -m pip install .
          else
            python -m pip install .
          fi
      - name: Verify installed command
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            .ci-venv/bin/reliq --help
          else
            reliq --help
          fi
      - name: Test package and GUI interactions
        env:
          RELIQ_REQUIRE_GUI: "1"
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a .ci-venv/bin/python -m unittest discover -v
            xvfb-run -a .ci-venv/bin/python tests/smoke_installed.py
            .ci-venv/bin/python scripts/smoke_source_archive.py --checkout tests/smoke_cli.py
          else
            python -m unittest discover -v
            python tests/smoke_installed.py
            python scripts/smoke_source_archive.py --checkout tests/smoke_cli.py
          fi
